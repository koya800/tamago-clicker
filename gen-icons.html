<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>PNGアイコン生成ツール</title>
<style>
body{font-family:sans-serif;padding:20px;text-align:center;background:#fff8fd;}
.box{display:inline-block;margin:10px;padding:10px;background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
canvas{border:1px solid #ddd;border-radius:8px;display:block;margin:10px auto}
button{padding:12px 24px;margin:8px;font-size:14px;font-weight:bold;background:#ff6eb4;color:white;border:none;border-radius:8px;cursor:pointer}
button:hover{background:#ff3399}
h1{color:#ff6eb4}
.note{background:#fffaee;padding:14px;border-radius:8px;border:1.5px solid #ffd6a0;margin:20px auto;max-width:520px;text-align:left;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<h1>🥚 タマゴクリッカー PNG アイコン生成</h1>
<div class="note">
  <b>使い方:</b><br>
  1️⃣ 下のボタンを押すと <code>icon-192.png</code> と <code>icon-512.png</code> がダウンロードされます<br>
  2️⃣ ダウンロードフォルダから <code>tamago-clicker</code> フォルダに移動<br>
  3️⃣ GitHub Desktop で commit & push<br>
  4️⃣ このファイル（gen-icons.html）はリポにコミットしなくてOK
</div>

<div class="box">
  <h3>192×192</h3>
  <canvas id="c1" width="192" height="192"></canvas>
  <button onclick="dl(192)">⬇ icon-192.png をダウンロード</button>
</div>

<div class="box">
  <h3>512×512</h3>
  <canvas id="c2" width="512" height="512"></canvas>
  <button onclick="dl(512)">⬇ icon-512.png をダウンロード</button>
</div>

<br>
<button onclick="dl(192);setTimeout(()=>dl(512),200)" style="background:#9060c0;font-size:16px">⬇ 両方一括ダウンロード</button>

<script>
function makeSvg(size){
  const sc=size/192;
  const rx=80*(size/512);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff0f8"/>
        <stop offset="100%" stop-color="#ffe6f5"/>
      </linearGradient>
      <linearGradient id="g" x1="30%" y1="10%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#fff0f8"/>
        <stop offset="100%" stop-color="#ffb6e8"/>
      </linearGradient>
      <radialGradient id="shine" cx="40%" cy="35%" r="20%">
        <stop offset="0%" stop-color="white" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="white" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="${size}" height="${size}" rx="${rx}" fill="url(#bg)"/>
    <ellipse cx="${size/2}" cy="${size*0.55}" rx="${size*0.32}" ry="${size*0.4}" fill="url(#g)" stroke="#ff9de2" stroke-width="${size/64}"/>
    <ellipse cx="${size*0.4}" cy="${size*0.4}" rx="${size*0.09}" ry="${size*0.05}" fill="white" opacity=".7" transform="rotate(-30 ${size*0.4} ${size*0.4})"/>
  </svg>`;
}

function render(size,canvasId){
  const c=document.getElementById(canvasId);
  const ctx=c.getContext('2d');
  const svg=makeSvg(size);
  const img=new Image();
  const blob=new Blob([svg],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    ctx.clearRect(0,0,size,size);
    ctx.drawImage(img,0,0,size,size);
    URL.revokeObjectURL(url);
  };
  img.src=url;
}

function dl(size){
  const c=document.getElementById(size===192?'c1':'c2');
  c.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='icon-'+size+'.png';
    a.click();
    URL.revokeObjectURL(url);
  },'image/png');
}

render(192,'c1');
render(512,'c2');
</script>
</body>
</html>
